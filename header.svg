<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="El Zidane Ardyansyah - Web Developer, Mobile Developer, UI/UX Designer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="500" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="860 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="c"><rect width="1200" height="340" rx="22"/></clipPath>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8b949e"/></pattern>
<style>
.mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.name{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-out infinite}
@keyframes pu{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
</style></defs>
<g clip-path="url(#c)">
<rect width="1200" height="340" fill="#0D1117"/>
<circle cx="220" cy="120" r="150" fill="#3B82F6" opacity=".38" filter="url(#b)">
<animate attributeName="cx" values="220;520;220" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="120;230;120" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="220" r="170" fill="#8B5CF6" opacity=".38" filter="url(#b)">
<animate attributeName="cx" values="980;760;980" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="220;90;220" dur="12s" repeatCount="indefinite"/></circle>
<rect width="1200" height="340" fill="url(#d)" opacity=".16"/>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#30363d"/>
<text x="70" y="72" font-size="15" class="mono" fill="#8b949e">zidane@malang:~$ ./hello</text>
<rect x="292" y="58" width="9" height="17" fill="#3B82F6" class="blink"/>
<text x="70" y="168" font-size="66" font-weight="800" class="sans name" fill="url(#g)">El Zidane Ardyansyah</text>
<text x="70" y="228" font-size="28" class="sans" fill="#c9d1d9" opacity="0"><tspan fill="#3B82F6" class="mono">›</tspan> Full Stack Web Developer
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
<text x="70" y="228" font-size="28" class="sans" fill="#c9d1d9" opacity="0"><tspan fill="#3B82F6" class="mono">›</tspan> Flutter &amp; Dart Mobile Developer
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
<text x="70" y="228" font-size="28" class="sans" fill="#c9d1d9" opacity="0"><tspan fill="#3B82F6" class="mono">›</tspan> UI/UX Designer
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>

<g transform="translate(70 262)"><rect width="300" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
<circle cx="22" cy="17" r="5" fill="#3fb950" class="pulse"/><circle cx="22" cy="17" r="5" fill="#3fb950"/>
<text x="40" y="22" font-size="14" class="sans" fill="#c9d1d9">Open to Internship &amp; Freelance</text></g>
<text x="1130" y="300" text-anchor="end" font-size="14" class="mono" fill="#8b949e">SMK Telkom Malang · RPL 2024–2027</text>
<g transform="translate(985 165)">
<g><circle r="100" fill="none" stroke="#3B82F6" stroke-opacity=".55" stroke-dasharray="3 9" stroke-width="2"/><circle cx="100" r="6" fill="#3B82F6"/>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></g>
<g><circle r="64" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-dasharray="2 7" stroke-width="2"/><circle cx="-64" r="5" fill="#A78BFA"/>
<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></g>
<g class="float"><text text-anchor="middle" y="14" font-size="42" font-weight="700" class="mono" fill="#e6edf3">&lt;/&gt;</text></g></g>
</svg>